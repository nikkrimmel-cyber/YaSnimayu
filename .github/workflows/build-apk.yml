name: Build YaSnimayu APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          cat > create_project.py <<'PYEOF'
          from pathlib import Path
          import base64
          root = Path('.')
          files = {
              'settings.gradle': 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "YaSnimayu"\ninclude(":app")\n',
              'build.gradle': "plugins {\n    id 'com.android.application' version '8.7.3' apply false\n}\n",
              'gradle.properties': 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=false\nandroid.nonTransitiveRClass=true\n',
              'app/build.gradle': 'plugins {\n    id \'com.android.application\'\n}\n\nandroid {\n    namespace \'kz.nikita.yasnimayu\'\n    compileSdk 35\n\n    defaultConfig {\n        applicationId "kz.nikita.yasnimayu"\n        minSdk 24\n        targetSdk 35\n        versionCode 3\n        versionName "0.3-test"\n    }\n\n    buildTypes {\n        release {\n            minifyEnabled false\n        }\n    }\n}\n',
              'app/src/main/AndroidManifest.xml': '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n\n    <application\n        android:allowBackup="false"\n        android:label="Я снимаю"\n        android:theme="@style/AppTheme"\n        android:supportsRtl="true"\n        android:usesCleartextTraffic="false">\n        <activity\n            android:name=".MainActivity"\n            android:screenOrientation="portrait"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN"/>\n                <category android:name="android.intent.category.LAUNCHER"/>\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n',
              'app/src/main/res/values/styles.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">\n        <item name="android:fontFamily">sans</item>\n        <item name="android:windowLightStatusBar">false</item>\n        <item name="android:statusBarColor">#0A0A0A</item>\n        <item name="android:navigationBarColor">#0A0A0A</item>\n        <item name="android:colorAccent">#FF2B2B</item>\n    </style>\n</resources>\n',
              'app/src/main/res/values/strings.xml': '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">Я снимаю</string>\n</resources>\n',
              'app/src/main/java/kz/nikita/yasnimayu/MainActivity.java': '\npackage kz.nikita.yasnimayu;\n\nimport android.Manifest;\nimport android.app.Activity;\nimport android.app.AlertDialog;\nimport android.content.ContentValues;\nimport android.content.Intent;\nimport android.content.SharedPreferences;\nimport android.content.pm.PackageManager;\nimport android.graphics.Color;\nimport android.graphics.Typeface;\nimport android.net.Uri;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.provider.MediaStore;\nimport android.security.keystore.KeyGenParameterSpec;\nimport android.security.keystore.KeyProperties;\nimport android.util.Base64;\nimport android.view.Gravity;\nimport android.view.View;\nimport android.widget.*;\nimport android.graphics.drawable.GradientDrawable;\n\nimport java.io.*;\nimport java.net.Socket;\nimport java.nio.charset.StandardCharsets;\nimport java.security.KeyStore;\nimport java.text.SimpleDateFormat;\nimport java.util.Date;\nimport java.util.Locale;\nimport java.util.UUID;\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\nimport javax.crypto.Cipher;\nimport javax.crypto.KeyGenerator;\nimport javax.crypto.SecretKey;\nimport javax.crypto.spec.GCMParameterSpec;\nimport javax.net.ssl.SSLSocket;\nimport javax.net.ssl.SSLSocketFactory;\n\npublic class MainActivity extends Activity {\n    private static final int REQ_CAMERA = 10;\n    private static final int REQ_GALLERY = 11;\n    private static final int REQ_PERMISSION_CAMERA = 12;\n    private static final String KEY_ALIAS = "yasnimayu_mail_key";\n\n    private Uri selectedImage;\n    private FrameLayout root;\n    private SharedPreferences prefs;\n    private TextView statusText;\n    private final ExecutorService executor = Executors.newSingleThreadExecutor();\n\n    @Override\n    protected void onCreate(Bundle b) {\n        super.onCreate(b);\n        prefs = getSharedPreferences("settings", MODE_PRIVATE);\n        showHome();\n    }\n\n    private TextView text(String s, int sp, int color, boolean bold) {\n        TextView v = new TextView(this);\n        v.setText(s);\n        v.setTextSize(sp);\n        v.setTextColor(color);\n        v.setGravity(Gravity.CENTER);\n        if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);\n        return v;\n    }\n\n    private GradientDrawable rounded(int color, float radiusDp, int strokeColor, int strokeWidthDp) {\n        GradientDrawable gd = new GradientDrawable();\n        gd.setColor(color);\n        gd.setCornerRadius(dp(radiusDp));\n        if (strokeWidthDp > 0) gd.setStroke(dp(strokeWidthDp), strokeColor);\n        return gd;\n    }\n\n    private Button button(String label, boolean red) {\n        Button b = new Button(this);\n        b.setText(label);\n        b.setAllCaps(false);\n        b.setTextSize(18);\n        b.setTextColor(Color.WHITE);\n        b.setTypeface(Typeface.DEFAULT, Typeface.BOLD);\n        b.setBackground(rounded(red ? Color.rgb(255,43,43) : Color.rgb(35,40,46), 14, Color.TRANSPARENT, 0));\n        b.setMinHeight(dp(58));\n        return b;\n    }\n\n    private void base() {\n        root = new FrameLayout(this);\n        root.setBackgroundColor(Color.rgb(8,8,8));\n        setContentView(root);\n    }\n\n    private void showHome() {\n        base();\n\n        ImageView bg = new ImageView(this);\n        bg.setImageResource(R.drawable.main_bg);\n        bg.setScaleType(ImageView.ScaleType.CENTER_CROP);\n        root.addView(bg, new FrameLayout.LayoutParams(-1,-1));\n\n        View shade = new View(this);\n        shade.setBackgroundColor(Color.argb(118,0,0,0));\n        root.addView(shade, new FrameLayout.LayoutParams(-1,-1));\n\n        LinearLayout col = new LinearLayout(this);\n        col.setOrientation(LinearLayout.VERTICAL);\n        col.setPadding(dp(24), dp(36), dp(24), dp(28));\n        col.setGravity(Gravity.CENTER_HORIZONTAL);\n        root.addView(col, new FrameLayout.LayoutParams(-1,-1));\n\n        TextView title = text("Я СНИМАЮ", 38, Color.WHITE, true);\n        title.setShadowLayer(10,0,3,Color.BLACK);\n        col.addView(title, new LinearLayout.LayoutParams(-1,0,1.0f));\n\n        TextView sub = text("СНЯЛ  •  И СРАЗУ ОТПРАВИЛ", 14, Color.LTGRAY, false);\n        col.addView(sub, new LinearLayout.LayoutParams(-1,0,.25f));\n\n        Space space = new Space(this);\n        col.addView(space, new LinearLayout.LayoutParams(1,0,2.8f));\n\n        statusText = text(configured() ? "Почта настроена. Можно снимать." : "Сначала настройте почту.", 14,\n                configured() ? Color.rgb(120,235,145) : Color.rgb(255,195,90), true);\n        col.addView(statusText, new LinearLayout.LayoutParams(-1, dp(42)));\n\n        Button camera = button("📷  Сделать фото и отправить", true);\n        camera.setOnClickListener(v -> {\n            if (!configured()) showSettings();\n            else takePhoto();\n        });\n        col.addView(camera, lpButton());\n\n        Button gallery = button("🖼  Отправить фото из галереи", false);\n        gallery.setOnClickListener(v -> {\n            if (!configured()) showSettings();\n            else pickGallery();\n        });\n        col.addView(gallery, lpButton());\n\n        Button settings = button("⚙  Настройки почты", false);\n        settings.setOnClickListener(v -> showSettings());\n        col.addView(settings, lpButton());\n\n        TextView foot = text("После съёмки фото отправляется автоматически.", 12, Color.LTGRAY, false);\n        LinearLayout.LayoutParams fp = new LinearLayout.LayoutParams(-1,0,.45f);\n        fp.topMargin = dp(12);\n        col.addView(foot, fp);\n    }\n\n    private boolean configured() {\n        return !prefs.getString("login","").trim().isEmpty()\n                && !prefs.getString("recipient","").trim().isEmpty()\n                && !getSavedPassword().trim().isEmpty();\n    }\n\n    private LinearLayout.LayoutParams lpButton() {\n        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, dp(62));\n        p.topMargin = dp(12);\n        return p;\n    }\n\n    private void takePhoto() {\n        if (Build.VERSION.SDK_INT >= 23 &&\n                checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {\n            requestPermissions(new String[]{Manifest.permission.CAMERA}, REQ_PERMISSION_CAMERA);\n            return;\n        }\n        launchCamera();\n    }\n\n    private void launchCamera() {\n        try {\n            ContentValues values = new ContentValues();\n            String stamp = new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.getDefault()).format(new Date());\n            values.put(MediaStore.Images.Media.DISPLAY_NAME, "YSNIMAYU_" + stamp + ".jpg");\n            values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q)\n                values.put(MediaStore.Images.Media.RELATIVE_PATH, "Pictures/YaSnimayu");\n\n            selectedImage = getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, values);\n            Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);\n            i.putExtra(MediaStore.EXTRA_OUTPUT, selectedImage);\n            i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);\n            startActivityForResult(i, REQ_CAMERA);\n        } catch (Exception e) {\n            toast("Не удалось открыть камеру: " + e.getMessage());\n        }\n    }\n\n    private void pickGallery() {\n        Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n        i.addCategory(Intent.CATEGORY_OPENABLE);\n        i.setType("image/*");\n        startActivityForResult(i, REQ_GALLERY);\n    }\n\n    @Override\n    public void onRequestPermissionsResult(int requestCode, String[] perms, int[] grants) {\n        super.onRequestPermissionsResult(requestCode, perms, grants);\n        if (requestCode == REQ_PERMISSION_CAMERA && grants.length > 0 && grants[0] == PackageManager.PERMISSION_GRANTED)\n            launchCamera();\n        else if (requestCode == REQ_PERMISSION_CAMERA)\n            toast("Без разрешения камеры фото сделать нельзя.");\n    }\n\n    @Override\n    protected void onActivityResult(int requestCode, int resultCode, Intent data) {\n        super.onActivityResult(requestCode, resultCode, data);\n        if (requestCode == REQ_CAMERA && resultCode == RESULT_OK && selectedImage != null) {\n            sendSelectedImage();\n        } else if (requestCode == REQ_GALLERY && resultCode == RESULT_OK && data != null) {\n            selectedImage = data.getData();\n            if (selectedImage != null) {\n                try {\n                    getContentResolver().takePersistableUriPermission(selectedImage, Intent.FLAG_GRANT_READ_URI_PERMISSION);\n                } catch (Exception ignored) {}\n                sendSelectedImage();\n            }\n        }\n    }\n\n    private void sendSelectedImage() {\n        if (selectedImage == null) return;\n        showSending();\n        final Uri image = selectedImage;\n        executor.execute(() -> {\n            try {\n                String provider = prefs.getString("provider", "gmail");\n                String host = provider.equals("icloud") ? "smtp.mail.me.com" : "smtp.gmail.com";\n                int port = 587;\n                String login = prefs.getString("login","");\n                String password = getSavedPassword();\n                String recipient = prefs.getString("recipient","");\n                String subject = prefs.getString("subject","Фото — Я снимаю");\n                smtpSendStartTls(host, port, login, password, recipient, subject, image);\n                runOnUiThread(() -> showSuccess());\n            } catch (Exception e) {\n                runOnUiThread(() -> showError(e.getMessage()));\n            }\n        });\n    }\n\n    private void showSending() {\n        base();\n        LinearLayout col = screenColumn();\n        col.setGravity(Gravity.CENTER);\n\n        ProgressBar pb = new ProgressBar(this);\n        col.addView(pb, new LinearLayout.LayoutParams(dp(70),dp(70)));\n\n        TextView h = text("Отправляем фото…", 26, Color.WHITE, true);\n        LinearLayout.LayoutParams hp = new LinearLayout.LayoutParams(-1,dp(80));\n        hp.topMargin=dp(22);\n        col.addView(h,hp);\n\n        TextView s = text("Не закрывайте приложение несколько секунд.", 14, Color.LTGRAY, false);\n        col.addView(s,new LinearLayout.LayoutParams(-1,dp(60)));\n    }\n\n    private void showSuccess() {\n        base();\n        LinearLayout col = screenColumn();\n        col.setGravity(Gravity.CENTER);\n\n        TextView ok = text("✓", 72, Color.rgb(95,230,125), true);\n        col.addView(ok,new LinearLayout.LayoutParams(-1,dp(110)));\n\n        TextView h = text("Фото отправлено", 28, Color.WHITE, true);\n        col.addView(h,new LinearLayout.LayoutParams(-1,dp(70)));\n\n        TextView s = text("Получатель:\\n" + prefs.getString("recipient",""), 15, Color.LTGRAY, false);\n        col.addView(s,new LinearLayout.LayoutParams(-1,dp(85)));\n\n        Button again = button("📷  Сделать ещё фото", true);\n        again.setOnClickListener(v -> takePhoto());\n        col.addView(again,lpButton());\n\n        Button home = button("На главную", false);\n        home.setOnClickListener(v -> showHome());\n        col.addView(home,lpButton());\n    }\n\n    private void showError(String message) {\n        base();\n        LinearLayout col = screenColumn();\n        col.setGravity(Gravity.CENTER);\n\n        TextView x = text("!", 72, Color.rgb(255,85,85), true);\n        col.addView(x,new LinearLayout.LayoutParams(-1,dp(110)));\n\n        TextView h = text("Не удалось отправить", 26, Color.WHITE, true);\n        col.addView(h,new LinearLayout.LayoutParams(-1,dp(70)));\n\n        TextView s = text(message == null ? "Неизвестная ошибка SMTP" : message, 14, Color.LTGRAY, false);\n        col.addView(s,new LinearLayout.LayoutParams(-1,0,1));\n\n        Button retry = button("Повторить отправку", true);\n        retry.setOnClickListener(v -> sendSelectedImage());\n        col.addView(retry,lpButton());\n\n        Button settings = button("Проверить настройки", false);\n        settings.setOnClickListener(v -> showSettings());\n        col.addView(settings,lpButton());\n    }\n\n    private void smtpSendStartTls(String host, int port, String login, String password,\n                                  String recipient, String subject, Uri imageUri) throws Exception {\n        Socket socket = new Socket(host, port);\n        socket.setSoTimeout(25000);\n        BufferedReader in = new BufferedReader(new InputStreamReader(socket.getInputStream(), StandardCharsets.US_ASCII));\n        BufferedWriter out = new BufferedWriter(new OutputStreamWriter(socket.getOutputStream(), StandardCharsets.US_ASCII));\n\n        expect(readResponse(in), 220);\n        sendLine(out, "EHLO yasnimayu.android");\n        expect(readResponse(in), 250);\n\n        sendLine(out, "STARTTLS");\n        expect(readResponse(in), 220);\n\n        SSLSocketFactory sslFactory = (SSLSocketFactory) SSLSocketFactory.getDefault();\n        SSLSocket ssl = (SSLSocket) sslFactory.createSocket(socket, host, port, true);\n        ssl.setUseClientMode(true);\n        ssl.startHandshake();\n\n        in = new BufferedReader(new InputStreamReader(ssl.getInputStream(), StandardCharsets.US_ASCII));\n        out = new BufferedWriter(new OutputStreamWriter(ssl.getOutputStream(), StandardCharsets.US_ASCII));\n\n        sendLine(out, "EHLO yasnimayu.android");\n        expect(readResponse(in), 250);\n\n        sendLine(out, "AUTH LOGIN");\n        expect(readResponse(in), 334);\n        sendLine(out, b64(login.getBytes(StandardCharsets.UTF_8)));\n        expect(readResponse(in), 334);\n        sendLine(out, b64(password.getBytes(StandardCharsets.UTF_8)));\n        expect(readResponse(in), 235);\n\n        sendLine(out, "MAIL FROM:<" + login + ">");\n        expect(readResponse(in), 250);\n        sendLine(out, "RCPT TO:<" + recipient + ">");\n        int rcpt = code(readResponse(in));\n        if (rcpt != 250 && rcpt != 251) throw new IOException("SMTP отклонил адрес получателя: " + rcpt);\n\n        sendLine(out, "DATA");\n        expect(readResponse(in), 354);\n\n        String boundary = "----YaSnimayu_" + UUID.randomUUID().toString().replace("-","");\n        String date = new SimpleDateFormat("EEE, dd MMM yyyy HH:mm:ss Z", Locale.US).format(new Date());\n        String filename = "photo_" + new SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(new Date()) + ".jpg";\n\n        writeRaw(out, "From: <" + login + ">\\r\\n");\n        writeRaw(out, "To: <" + recipient + ">\\r\\n");\n        writeRaw(out, "Date: " + date + "\\r\\n");\n        writeRaw(out, "Subject: =?UTF-8?B?" + b64(subject.getBytes(StandardCharsets.UTF_8)) + "?=\\r\\n");\n        writeRaw(out, "MIME-Version: 1.0\\r\\n");\n        writeRaw(out, "Content-Type: multipart/mixed; boundary=\\"" + boundary + "\\"\\r\\n\\r\\n");\n\n        writeRaw(out, "--" + boundary + "\\r\\n");\n        writeRaw(out, "Content-Type: text/plain; charset=UTF-8\\r\\n");\n        writeRaw(out, "Content-Transfer-Encoding: base64\\r\\n\\r\\n");\n        String defaultComment = prefs.getString("default_comment", "").trim();\n        StringBuilder bodyBuilder = new StringBuilder();\n        bodyBuilder.append("Фото автоматически отправлено из приложения «Я снимаю».\\n");\n        bodyBuilder.append("Дата и время: ")\n                .append(new SimpleDateFormat("dd.MM.yyyy HH:mm:ss", Locale.getDefault()).format(new Date()))\n                .append("\\n");\n        bodyBuilder.append("Устройство: ")\n                .append(Build.MANUFACTURER).append(" ").append(Build.MODEL).append("\\n");\n        if (!defaultComment.isEmpty()) {\n            bodyBuilder.append("Комментарий: ").append(defaultComment).append("\\n");\n        }\n        String body = bodyBuilder.toString();\n        writeRaw(out, wrap76(b64(body.getBytes(StandardCharsets.UTF_8))) + "\\r\\n");\n\n        writeRaw(out, "--" + boundary + "\\r\\n");\n        writeRaw(out, "Content-Type: image/jpeg; name=\\"" + filename + "\\"\\r\\n");\n        writeRaw(out, "Content-Disposition: attachment; filename=\\"" + filename + "\\"\\r\\n");\n        writeRaw(out, "Content-Transfer-Encoding: base64\\r\\n\\r\\n");\n\n        try (InputStream is = getContentResolver().openInputStream(imageUri)) {\n            if (is == null) throw new IOException("Не удалось открыть фотографию.");\n            byte[] buf = new byte[57]; // 57 bytes -> 76 Base64 chars\n            int n;\n            while ((n = is.read(buf)) != -1) {\n                byte[] chunk = (n == buf.length) ? buf : java.util.Arrays.copyOf(buf, n);\n                writeRaw(out, b64(chunk) + "\\r\\n");\n            }\n        }\n\n        writeRaw(out, "--" + boundary + "--\\r\\n.\\r\\n");\n        out.flush();\n        expect(readResponse(in), 250);\n\n        sendLine(out, "QUIT");\n        try { readResponse(in); } catch (Exception ignored) {}\n        ssl.close();\n    }\n\n    private void expect(String response, int expected) throws IOException {\n        int c = code(response);\n        if (c != expected) {\n            if (c == 534 || c == 535) throw new IOException("Ошибка авторизации. Проверьте логин и пароль приложения.");\n            throw new IOException("Ошибка SMTP " + c + ": " + clean(response));\n        }\n    }\n\n    private int code(String response) {\n        if (response == null || response.length() < 3) return -1;\n        try { return Integer.parseInt(response.substring(0,3)); }\n        catch(Exception e){ return -1; }\n    }\n\n    private String clean(String s) {\n        if (s == null) return "";\n        s = s.replace("\\r"," ").replace("\\n"," ");\n        return s.length() > 180 ? s.substring(0,180) : s;\n    }\n\n    private String readResponse(BufferedReader in) throws IOException {\n        String first = in.readLine();\n        if (first == null) throw new EOFException("SMTP сервер закрыл соединение.");\n        StringBuilder sb = new StringBuilder(first);\n        if (first.length() >= 4 && first.charAt(3) == \'-\') {\n            String prefix = first.substring(0,3) + " ";\n            String line;\n            while ((line = in.readLine()) != null) {\n                sb.append("\\n").append(line);\n                if (line.startsWith(prefix)) break;\n            }\n        }\n        return sb.toString();\n    }\n\n    private void sendLine(BufferedWriter out, String s) throws IOException {\n        writeRaw(out, s + "\\r\\n");\n        out.flush();\n    }\n\n    private void writeRaw(BufferedWriter out, String s) throws IOException {\n        out.write(s);\n    }\n\n    private String b64(byte[] bytes) {\n        return Base64.encodeToString(bytes, Base64.NO_WRAP);\n    }\n\n    private String wrap76(String s) {\n        StringBuilder r = new StringBuilder();\n        for (int i=0;i<s.length();i+=76) {\n            if (i>0) r.append("\\r\\n");\n            r.append(s, i, Math.min(i+76,s.length()));\n        }\n        return r.toString();\n    }\n\n    private void showSettings() {\n        base();\n        ScrollView scroll = new ScrollView(this);\n        root.addView(scroll,new FrameLayout.LayoutParams(-1,-1));\n\n        LinearLayout col = new LinearLayout(this);\n        col.setOrientation(LinearLayout.VERTICAL);\n        col.setPadding(dp(18),dp(24),dp(18),dp(28));\n        col.setBackgroundColor(Color.rgb(10,12,14));\n        scroll.addView(col,new ScrollView.LayoutParams(-1,-2));\n\n        TextView head = text("Настройки почты", 28, Color.WHITE, true);\n        col.addView(head,new LinearLayout.LayoutParams(-1,dp(70)));\n\n        label(col,"Тип устройства / почты");\n        Spinner provider = new Spinner(this);\n        String[] items = {"Android — Gmail", "iPhone — iCloud Mail"};\n        ArrayAdapter<String> adapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_dropdown_item, items);\n        provider.setAdapter(adapter);\n        provider.setSelection(prefs.getString("provider","gmail").equals("icloud") ? 1 : 0);\n        col.addView(provider,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        TextView preset = text("", 13, Color.LTGRAY, false);\n        preset.setGravity(Gravity.LEFT);\n        LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(-1,dp(70));\n        pp.topMargin=dp(4);\n        col.addView(preset,pp);\n\n        Runnable updatePreset = () -> {\n            if (provider.getSelectedItemPosition() == 1)\n                preset.setText("Автоматически: smtp.mail.me.com • порт 587 • STARTTLS");\n            else\n                preset.setText("Автоматически: smtp.gmail.com • порт 587 • STARTTLS");\n        };\n        provider.setOnItemSelectedListener(new android.widget.AdapterView.OnItemSelectedListener() {\n            public void onItemSelected(android.widget.AdapterView<?> p, View v, int pos, long id){ updatePreset.run(); }\n            public void onNothingSelected(android.widget.AdapterView<?> p){}\n        });\n        updatePreset.run();\n\n        label(col,"Логин почты");\n        EditText login = edit(prefs.getString("login",""));\n        login.setHint(provider.getSelectedItemPosition()==1 ? "name@icloud.com" : "name@gmail.com");\n        col.addView(login,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        label(col,"Пароль приложения");\n        EditText password = edit(getSavedPassword());\n        password.setHint("Пароль приложения");\n        password.setInputType(android.text.InputType.TYPE_CLASS_TEXT | android.text.InputType.TYPE_TEXT_VARIATION_PASSWORD);\n        col.addView(password,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        TextView note = text(\n                "Для Gmail рекомендуется пароль приложения Google. Для iCloud нужен пароль приложения Apple. "\n                + "Обычный пароль аккаунта хранить здесь не рекомендуется.",\n                13, Color.rgb(255,195,90), false);\n        note.setGravity(Gravity.LEFT);\n        LinearLayout.LayoutParams np = new LinearLayout.LayoutParams(-1,dp(92));\n        np.topMargin=dp(6);\n        col.addView(note,np);\n\n        label(col,"Куда отправлять фото");\n        EditText recipient = edit(prefs.getString("recipient",""));\n        recipient.setHint("recipient@example.com");\n        col.addView(recipient,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        label(col,"Тема письма");\n        EditText subject = edit(prefs.getString("subject","Фото — Я снимаю"));\n        col.addView(subject,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        label(col,"Комментарий по умолчанию (необязательно)");\n        EditText defaultComment = edit(prefs.getString("default_comment",""));\n        defaultComment.setHint("Например: Фотоотчёт с объекта");\n        col.addView(defaultComment,new LinearLayout.LayoutParams(-1,dp(58)));\n\n        Button save = button("Сохранить настройки", true);\n        save.setOnClickListener(v -> {\n            String prov = provider.getSelectedItemPosition()==1 ? "icloud" : "gmail";\n            String l = login.getText().toString().trim();\n            String pass = password.getText().toString();\n            String rec = recipient.getText().toString().trim();\n            if (l.isEmpty() || pass.isEmpty() || rec.isEmpty()) {\n                toast("Заполните логин, пароль приложения и адрес получателя.");\n                return;\n            }\n            if (!l.contains("@") || !rec.contains("@")) {\n                toast("Проверьте адреса электронной почты.");\n                return;\n            }\n            prefs.edit()\n                    .putString("provider",prov)\n                    .putString("login",l)\n                    .putString("recipient",rec)\n                    .putString("subject",subject.getText().toString().trim())\n                    .putString("default_comment",defaultComment.getText().toString().trim())\n                    .apply();\n            try {\n                savePassword(pass);\n            } catch (Exception e) {\n                toast("Не удалось безопасно сохранить пароль: " + e.getMessage());\n                return;\n            }\n            toast("Настройки сохранены.");\n            showHome();\n        });\n        col.addView(save,lpButton());\n\n        Button back = button("← Назад", false);\n        back.setOnClickListener(v -> showHome());\n        col.addView(back,lpButton());\n    }\n\n    private void label(LinearLayout col, String value) {\n        TextView l = text(value,15,Color.LTGRAY,false);\n        l.setGravity(Gravity.LEFT|Gravity.CENTER_VERTICAL);\n        LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,dp(42));\n        p.topMargin=dp(8);\n        col.addView(l,p);\n    }\n\n    private EditText edit(String value) {\n        EditText e = new EditText(this);\n        e.setText(value);\n        e.setTextColor(Color.WHITE);\n        e.setHintTextColor(Color.GRAY);\n        e.setSingleLine(true);\n        e.setPadding(dp(14),0,dp(14),0);\n        e.setBackground(rounded(Color.rgb(25,28,32),12,Color.DKGRAY,1));\n        return e;\n    }\n\n    private LinearLayout screenColumn() {\n        LinearLayout col = new LinearLayout(this);\n        col.setOrientation(LinearLayout.VERTICAL);\n        col.setPadding(dp(18),dp(24),dp(18),dp(22));\n        col.setBackgroundColor(Color.rgb(10,12,14));\n        root.addView(col,new FrameLayout.LayoutParams(-1,-1));\n        return col;\n    }\n\n    private void savePassword(String password) throws Exception {\n        SecretKey key = getOrCreateKey();\n        Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");\n        cipher.init(Cipher.ENCRYPT_MODE,key);\n        byte[] iv = cipher.getIV();\n        byte[] enc = cipher.doFinal(password.getBytes(StandardCharsets.UTF_8));\n        prefs.edit()\n                .putString("pwd_iv", Base64.encodeToString(iv,Base64.NO_WRAP))\n                .putString("pwd_enc", Base64.encodeToString(enc,Base64.NO_WRAP))\n                .apply();\n    }\n\n    private String getSavedPassword() {\n        try {\n            String ivs = prefs.getString("pwd_iv","");\n            String ens = prefs.getString("pwd_enc","");\n            if (ivs.isEmpty() || ens.isEmpty()) return "";\n            SecretKey key = getOrCreateKey();\n            Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");\n            cipher.init(Cipher.DECRYPT_MODE,key,new GCMParameterSpec(128,Base64.decode(ivs,Base64.NO_WRAP)));\n            byte[] dec = cipher.doFinal(Base64.decode(ens,Base64.NO_WRAP));\n            return new String(dec,StandardCharsets.UTF_8);\n        } catch(Exception e) {\n            return "";\n        }\n    }\n\n    private SecretKey getOrCreateKey() throws Exception {\n        KeyStore ks = KeyStore.getInstance("AndroidKeyStore");\n        ks.load(null);\n        if (ks.containsAlias(KEY_ALIAS)) {\n            return ((KeyStore.SecretKeyEntry)ks.getEntry(KEY_ALIAS,null)).getSecretKey();\n        }\n        KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore");\n        KeyGenParameterSpec spec = new KeyGenParameterSpec.Builder(\n                KEY_ALIAS, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)\n                .setBlockModes(KeyProperties.BLOCK_MODE_GCM)\n                .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)\n                .build();\n        kg.init(spec);\n        return kg.generateKey();\n    }\n\n    private void toast(String s) {\n        Toast.makeText(this,s,Toast.LENGTH_LONG).show();\n    }\n\n    private int dp(float v) {\n        return (int)(v * getResources().getDisplayMetrics().density + 0.5f);\n    }\n\n    @Override\n    public void onBackPressed() {\n        showHome();\n    }\n\n    @Override\n    protected void onDestroy() {\n        executor.shutdownNow();\n        super.onDestroy();\n    }\n}\n',
