name: Build BGEK 3x4 APK v1.0

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-bgek-v1.0.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack BGEK 3x4 project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q BGEK_3x4_v1.0_Project.zip -d buildsrc
          test -f buildsrc/settings.gradle
          test -f buildsrc/app/build.gradle

      - name: Build APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk BGEK-3x4-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BGEK-3x4-v1.0-APK
          path: BGEK-3x4-v1.0.apk
          retention-days: 30
