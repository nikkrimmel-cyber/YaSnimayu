name: Build Nikita TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Nikita TV project
        shell: bash
        run: |
          set -euo pipefail

          # Вариант 1: проект уже распакован в корне репозитория.
          if [ -f "$GITHUB_WORKSPACE/settings.gradle" ] || [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            # Вариант 2: в репозитории лежит только ZIP + этот workflow.
            ZIP_FILE=""
            if [ -f "$GITHUB_WORKSPACE/NikitaTV.zip" ]; then
              ZIP_FILE="$GITHUB_WORKSPACE/NikitaTV.zip"
            else
              ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \
                \( -iname 'NikitaTV*.zip' -o -iname '*Nikita*TV*.zip' \) \
                ! -path '*/.git/*' | head -n 1 || true)
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Не найден Android-проект и не найден ZIP NikitaTV*.zip"
              echo "Положи NikitaTV.zip в корень репозитория."
              exit 1
            fi

            echo "Using ZIP: $ZIP_FILE"
            EXTRACT_DIR="$RUNNER_TEMP/nikitatv-src"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SETTINGS_FILE=$(find "$EXTRACT_DIR" -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              | head -n 1 || true)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: В ZIP не найден settings.gradle/settings.gradle.kts"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NikitaTV-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NikitaTV-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NikitaTV-debug-apk
          path: NikitaTV-debug.apk
          if-no-files-found: error
          retention-days: 30
