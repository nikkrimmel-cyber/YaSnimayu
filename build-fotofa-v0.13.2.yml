name: Build Foto FA APK v0.13.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Foto FA project
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q FotoFA_v0.13.2_Project.zip -d buildsrc
          test -f buildsrc/FotoFA/settings.gradle
          test -f buildsrc/FotoFA/app/build.gradle

      - name: Build APK
        working-directory: buildsrc/FotoFA
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp buildsrc/FotoFA/app/build/outputs/apk/debug/app-debug.apk Foto-FA-v0.13.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foto-FA-v0.13.2-APK
          path: Foto-FA-v0.13.2.apk
          retention-days: 30
